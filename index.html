<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primoria</title>
<style>
:root{--bg:#11110f;--panel:#1c1b17;--text:#f4eedf;--muted:#b8af9a;--gold:#d5b66f;--paper:#efe5cf;--ink:#2a261f;--border:#3a382f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif}
.app{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:2.3rem}.sub{color:var(--muted);margin-top:4px}.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:var(--panel);padding:8px 12px;border-radius:999px;color:var(--muted)}
nav{display:flex;gap:8px;overflow:auto;padding:18px 0}nav button,.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer}
nav button.active,.primary{background:var(--gold);color:#17130c;border-color:var(--gold);font-weight:bold}
.hero,.card{border:1px solid var(--border);background:var(--panel);border-radius:16px}.hero{padding:24px;margin-bottom:18px}.hero p,.card p{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{padding:16px;cursor:pointer}.card:hover{border-color:var(--gold)}
.tag{display:inline-block;margin-top:10px;padding:5px 8px;border-radius:999px;background:#28261f;color:var(--gold);font-size:.82rem}
.reader{background:var(--paper);color:var(--ink);padding:24px;border-radius:16px;line-height:1.7}.quote{border-left:4px solid #9d8042;padding-left:15px;font-style:italic}
.vocab,.quiz{background:#dfd2b8;padding:14px;border-radius:10px;margin:12px 0}.option{width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #b9aa8d;background:#f7eedc;cursor:pointer}
.search{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);margin-bottom:14px}
small{color:var(--muted)}.footer{text-align:center;color:var(--muted);margin:28px 0}
</style>
</head>
<body><div class="app">
<div class="top"><div><h1>Primoria</h1><div class="sub">Learn from the original sources.</div></div>
<div class="stats"><div class="pill">XP <span id="xp">0</span></div><div class="pill">Completed <span id="done">0</span></div><div class="pill">Bookmarks <span id="marks">0</span></div></div></div>
<nav id="nav"></nav><main id="main"></main><div class="footer">Free local prototype. Progress is saved on this device.</div>
</div>
<script>
const tabs=[['home','Home'],['history','Western History'],['classics','Classics'],['philosophy','Philosophy'],['theology','Theology'],['law','Law'],['politics','Political Thought'],['library','Library']];
const lessons=[
{id:'odyssey',school:'classics',title:'The Odyssey: The Call to Return',author:'Homer',era:'Ancient Greece',context:'The Odyssey follows Odysseus as he struggles to return home after the Trojan War. It explores identity, loyalty, hospitality, endurance, and leadership.',excerpt:'Tell me, Muse, of the man of many ways, who was driven far journeys, after he had sacked Troy’s sacred citadel.',vocab:'Muse: a divine source of poetic inspiration.',q:'What is emphasized in the opening description of Odysseus?',o:['His wealth','His many-sided character and long journey','His youth','His divine birth'],a:1,e:'The opening presents Odysseus as complex, resourceful, and shaped by long experience.'},
{id:'iliad',school:'classics',title:'The Iliad: The Anger of Achilles',author:'Homer',era:'Ancient Greece',context:'The Iliad centers on the consequences of Achilles’ anger, honor, mortality, and failed leadership.',excerpt:'Sing, goddess, the anger of Peleus’ son Achilles and its devastation.',vocab:'Honor: public recognition of worth or status.',q:'What is the poem’s opening subject?',o:['The fall of Troy','The anger of Achilles','The childhood of Hector','The founding of Rome'],a:1,e:'The poem explicitly begins with Achilles’ anger and its effects.'},
{id:'ovid',school:'classics',title:'Ovid: Forms Changed',author:'Ovid',era:'Rome',context:'Metamorphoses links myths through the theme of transformation and became deeply influential in Western literature and art.',excerpt:'My mind leads me to speak now of forms changed into new bodies.',vocab:'Metamorphosis: a transformation from one form into another.',q:'What unifies the stories of Metamorphoses?',o:['Military conquest','Transformation','Roman law','Agriculture'],a:1,e:'Transformation connects the poem’s many myths.'},
{id:'plato',school:'philosophy',title:'Plato: Justice and the City',author:'Plato',era:'Ancient Greece',context:'The Republic investigates justice in the city and in the individual soul.',excerpt:'We are not looking to make any one class outstandingly happy, but to make the city as a whole so.',vocab:'Justice: right order in persons or communities.',q:'What is this passage mainly concerned with?',o:['Private wealth','The good of the whole city','Military expansion','Religious ritual'],a:1,e:'The argument focuses on the good of the political community as a whole.'},
{id:'aristotle',school:'philosophy',title:'Aristotle: Virtue as Habit',author:'Aristotle',era:'Ancient Greece',context:'The Nicomachean Ethics asks how people become excellent and flourish.',excerpt:'We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.',vocab:'Virtue: a stable excellence of character.',q:'How does Aristotle say virtue is formed?',o:['By inheritance alone','By repeated practice','By avoiding society','By memorizing laws'],a:1,e:'Virtue develops through habituation and repeated action.'},
{id:'hammurabi',school:'law',title:'Hammurabi: Law and Kingship',author:'Code of Hammurabi',era:'Babylon',context:'The code presents royal justice through legal judgments and a prologue about the king’s authority.',excerpt:'To cause justice to prevail in the land... that the strong might not oppress the weak.',vocab:'Oppress: to treat unjustly through power.',q:'What purpose does the prologue assign to law?',o:['To increase trade only','To protect the weak and establish justice','To abolish kingship','To replace religion'],a:1,e:'The text presents law as restraining oppression and establishing order.'},
{id:'magna',school:'history',title:'England: Magna Carta',author:'Magna Carta',era:'England, 1215',context:'Magna Carta emerged from conflict between King John and his barons and became a symbol of lawful government.',excerpt:'No free man shall be seized or imprisoned... except by the lawful judgment of his equals or by the law of the land.',vocab:'Law of the land: established legal authority and procedure.',q:'Which principle is expressed here?',o:['Absolute monarchy','Lawful procedure before punishment','Religious uniformity','Military service'],a:1,e:'The clause limits arbitrary punishment through lawful process.'},
{id:'luther',school:'history',title:'Germany: Luther and Reform',author:'Martin Luther',era:'Germany, 1517',context:'The Ninety-Five Theses challenged abuses surrounding indulgences and helped ignite the Reformation.',excerpt:'The true treasure of the Church is the most holy gospel of the glory and grace of God.',vocab:'Indulgence: remission of temporal punishment in Catholic practice.',q:'What does Luther identify as the Church’s true treasure?',o:['Political authority','The gospel','Church property','Military power'],a:1,e:'Luther contrasts the gospel with the abuses he opposed.'},
{id:'france',school:'history',title:'France: Rights of Man',author:'Declaration of the Rights of Man and of the Citizen',era:'France, 1789',context:'The declaration articulated liberty, equality, sovereignty, and law during the French Revolution.',excerpt:'Men are born and remain free and equal in rights.',vocab:'Sovereignty: supreme political authority.',q:'What principle is asserted?',o:['Inherited privilege','Natural equality in rights','Royal absolutism','Religious monarchy'],a:1,e:'The text rejects legal inequality based on birth.'},
{id:'locke',school:'politics',title:'Locke: Government by Consent',author:'John Locke',era:'England',context:'The Second Treatise grounds legitimate authority in natural rights and consent.',excerpt:'No one can be... subjected to the political power of another without his own consent.',vocab:'Consent: voluntary agreement that gives authority legitimacy.',q:'What gives political authority legitimacy?',o:['Conquest','Consent','Wealth','Tradition alone'],a:1,e:'Locke grounds legitimate government in consent.'},
{id:'hobbes',school:'politics',title:'Hobbes: The Need for Sovereignty',author:'Thomas Hobbes',era:'England',context:'Leviathan argues that political order is necessary to escape insecurity and conflict.',excerpt:'Without a common power to keep them all in awe, they are in that condition which is called war.',vocab:'Sovereign: the highest political authority.',q:'What does Hobbes think is needed to prevent war?',o:['A common political power','More trade routes','Abolition of law','Isolation'],a:0,e:'Hobbes argues that peace requires an enforcing authority.'},
{id:'genesis',school:'theology',title:'Genesis: Creation and Order',author:'Genesis',era:'Ancient Israel',context:'The opening presents creation as ordered, purposeful, and dependent on divine action.',excerpt:'In the beginning God created the heavens and the earth.',vocab:'Creation: the act by which the world is brought into being.',q:'What does the opening verse establish?',o:['A divine origin of the cosmos','A Roman legal code','A Greek war','A political election'],a:0,e:'The verse introduces God as the source of creation.'}
];
let state={tab:'home',lesson:null,completed:JSON.parse(localStorage.getItem('p.done')||'[]'),marks:JSON.parse(localStorage.getItem('p.marks')||'[]'),xp:+(localStorage.getItem('p.xp')||0)};
const nav=document.getElementById('nav'),main=document.getElementById('main');
function save(){localStorage.setItem('p.done',JSON.stringify(state.completed));localStorage.setItem('p.marks',JSON.stringify(state.marks));localStorage.setItem('p.xp',state.xp);stats()}
function stats(){xp.textContent=state.xp;done.textContent=state.completed.length;marks.textContent=state.marks.length}
function go(t){state.tab=t;state.lesson=null;render()}
function openL(id){state.lesson=lessons.find(x=>x.id===id);render()}
function card(l){return `<div class="card" onclick="openL('${l.id}')"><h3>${l.title}</h3><p>${l.author} · ${l.era}</p><span class="tag">${state.completed.includes(l.id)?'Completed':'Start lesson'}${state.marks.includes(l.id)?' · Bookmarked':''}</span></div>`}
function desc(t){return {history:'Egypt, Greece, Rome, England, France, Germany, Spain, and Portugal through original sources.',classics:'Epic, drama, poetry, and literature from Homer, Ovid, Virgil, and more.',philosophy:'Ancient, medieval, modern, and contemporary thinkers in their own words.',theology:'Foundational texts and traditions, with scripture and commentary clearly distinguished.',law:'From ancient law to Magna Carta and constitutionalism.',politics:'Political thought from Plato and Aristotle through Hobbes, Locke, Rousseau, and Mill.'}[t]||''}
function render(){
nav.innerHTML=tabs.map(x=>`<button class="${state.tab===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
stats();
if(state.lesson)return lessonView(state.lesson);
if(state.tab==='home'){const next=lessons.find(x=>!state.completed.includes(x.id))||lessons[0];main.innerHTML=`<section class="hero"><h2>Read the texts that shaped Western civilization.</h2><p>Guided primary-source lessons in history, classics, philosophy, theology, law, and political thought.</p><button class="btn primary" onclick="openL('${next.id}')">Continue with ${next.title}</button></section><h2>Schools</h2><div class="grid">${tabs.filter(x=>!['home','library'].includes(x[0])).map(x=>`<div class="card" onclick="go('${x[0]}')"><h3>${x[1]}</h3><p>${desc(x[0])}</p></div>`).join('')}</div>`}
else if(state.tab==='library'){main.innerHTML=`<section class="hero"><h2>Library</h2><p>Search across authors, works, eras, and themes.</p></section><input class="search" id="q" placeholder="Search Homer, law, Rome..." oninput="search()"><div class="grid" id="results">${lessons.map(card).join('')}</div>`}
else{const label=tabs.find(x=>x[0]===state.tab)[1],items=lessons.filter(x=>x.school===state.tab);main.innerHTML=`<section class="hero"><h2>${label}</h2><p>${desc(state.tab)}</p></section><div class="grid">${items.map(card).join('')||'<p>More lessons coming soon.</p>'}</div>`}
}
function search(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('results').innerHTML=lessons.filter(l=>JSON.stringify(l).toLowerCase().includes(q)).map(card).join('')||'<p>No matches.</p>'}
function mark(id){state.marks.includes(id)?state.marks=state.marks.filter(x=>x!==id):state.marks.push(id);save();render()}
function lessonView(l){main.innerHTML=`<button class="btn" onclick="go('${l.school}')">← Back</button><article class="reader"><small>${l.author} · ${l.era}</small><h2>${l.title}</h2><h3>Context</h3><p>${l.context}</p><h3>Primary Source</h3><p class="quote">“${l.excerpt}”</p><div class="vocab"><strong>Vocabulary</strong><br>${l.vocab}</div><button class="btn" onclick="mark('${l.id}')">${state.marks.includes(l.id)?'Remove bookmark':'Bookmark lesson'}</button><div class="quiz"><h3>Quick Test</h3><p>${l.q}</p>${l.o.map((o,i)=>`<button class="option" onclick="answer('${l.id}',${i},this)">${o}</button>`).join('')}<div id="fb"></div></div></article>`}
function answer(id,i,b){const l=lessons.find(x=>x.id===id);document.querySelectorAll('.option').forEach(x=>x.disabled=true);b.style.background=i===l.a?'#cfe3c9':'#efc7bf';document.getElementById('fb').innerHTML=`<p><strong>${i===l.a?'Correct':'Not quite'}.</strong> ${l.e}</p>`;if(i===l.a&&!state.completed.includes(id)){state.completed.push(id);state.xp+=20;save()}}
render();
</script></body></html>
